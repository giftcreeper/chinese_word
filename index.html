<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>繁體中文筆順字帖生成器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HanziWriter for Chinese stroke order vectors & animation -->
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas for image export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Google Fonts: Noto Serif TC for elegant Chinese typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#F6F5F2',
                        stone: {
                            50: '#F9F8F6',
                            100: '#F1EFEA',
                            200: '#E2DFD7',
                            300: '#C8C4B7',
                            400: '#9E9885',
                            500: '#7B7563',
                            600: '#5F5A4B',
                            700: '#474337',
                            800: '#2E2B23',
                            900: '#1C1A15',
                        },
                        sage: {
                            50: '#F4F6F4',
                            100: '#E3ECE4',
                            600: '#3E5C4A',
                            700: '#334C3D',
                            800: '#283C30',
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        kaiti: ['"標楷體"', '"BiauKai"', '"DFKai-SB"', '"KaiTi"', '"Noto Serif TC"', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        /* Printable Page Constraints */
        @media print {
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            .print-area {
                box-shadow: none !important;
                margin: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                border: none !important;
                padding: 8mm !important;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
        }

        /* Paper preview styling */
        .a4-paper {
            width: 210mm;
            min-height: 297mm;
            background: #ffffff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05), 0 1px 3px rgba(0, 0, 0, 0.03);
            margin: 0 auto;
            position: relative;
        }

        /* Custom subtle scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 99px;
        }
    </style>
</head>
<body class="bg-[#ECEAE4] text-stone-800 font-sans min-h-screen flex flex-col antialiased">

    <!-- Navigation Header -->
    <header class="bg-[#F6F5F2] border-b border-stone-200 text-stone-800 sticky top-0 z-40 no-print">
        <div class="max-w-7xl mx-auto px-6 py-3.5 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3.5">
                <div class="w-10 h-10 bg-stone-800 text-amber-50 rounded-lg flex items-center justify-center font-serif text-xl font-bold shadow-sm">
                    字
                </div>
                <div>
                    <h1 class="text-base font-bold font-serif text-stone-800 tracking-wide flex items-center gap-2">
                        繁體中文筆順字帖生成器
                        <span class="text-[10px] bg-stone-200 text-stone-700 font-sans font-normal px-2 py-0.5 rounded">標準楷體</span>
                    </h1>
                    <p class="text-xs text-stone-500 font-serif">一筆一劃引導學習 ‧ 自動拆解筆順練習帖</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center space-x-2.5">
                <button onclick="triggerPrint()" class="bg-sage-600 hover:bg-sage-700 text-white px-4 py-2 rounded-lg text-xs font-semibold transition flex items-center shadow-sm">
                    <i class="fa-solid fa-print mr-2 opacity-90"></i> 列印字帖 (PDF)
                </button>
                <button onclick="exportImage()" class="bg-white hover:bg-stone-50 text-stone-700 border border-stone-300 px-3.5 py-2 rounded-lg text-xs font-medium transition shadow-sm">
                    <i class="fa-solid fa-download mr-1.5 text-stone-500"></i> 匯出圖片
                </button>
                <button onclick="toggleAnimationModal()" class="bg-amber-100 hover:bg-amber-200 text-amber-900 border border-amber-300 px-3.5 py-2 rounded-lg text-xs font-medium transition">
                    <i class="fa-solid fa-play mr-1.5 text-amber-700"></i> 筆順動畫
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Split Layout -->
    <div class="max-w-7xl mx-auto w-full flex-1 p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">

        <!-- Sidebar Control Panel -->
        <aside class="lg:col-span-4 space-y-4 no-print">

            <!-- Card 1: Input Controls -->
            <div class="bg-[#F9F8F6] p-5 rounded-xl border border-stone-200 shadow-sm space-y-4">
                <div class="flex items-center justify-between border-b border-stone-200 pb-2.5">
                    <h2 class="text-xs font-bold font-serif text-stone-700 tracking-wider uppercase flex items-center gap-2">
                        <i class="fa-solid fa-pen-nib text-sage-600"></i> 姓名與標題設定
                    </h2>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-stone-500 uppercase tracking-wider mb-1.5">繁體中文姓名</label>
                    <input type="text" id="inputName" value="王詩涵" placeholder="請輸入姓名 (如：王詩涵)" 
                        oninput="renderWorksheet()"
                        class="w-full text-lg font-serif font-bold px-3.5 py-2 border border-stone-300 rounded-lg focus:border-sage-600 focus:ring-1 focus:ring-sage-600 focus:outline-none transition tracking-widest text-center bg-white">
                    <div class="flex gap-2 mt-2 items-center">
                        <span class="text-[11px] text-stone-400">範例：</span>
                        <button onclick="setSampleName('王詩涵')" class="text-xs text-sage-600 hover:underline">王詩涵</button>
                        <button onclick="setSampleName('陳樂軒')" class="text-xs text-sage-600 hover:underline">陳樂軒</button>
                        <button onclick="setSampleName('張梓童')" class="text-xs text-sage-600 hover:underline">張梓童</button>
                        <button onclick="setSampleName('李嘉欣')" class="text-xs text-sage-600 hover:underline">李嘉欣</button>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-stone-500 uppercase tracking-wider mb-1.5">字帖頁頭標題</label>
                    <input type="text" id="inputSubtitle" value="全名筆順寫字帖" placeholder="字帖標題" 
                        oninput="renderWorksheet()"
                        class="w-full text-xs px-3 py-2 border border-stone-300 rounded-lg focus:border-sage-600 focus:outline-none bg-white">
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="block text-[11px] font-semibold text-stone-500 uppercase tracking-wider mb-1.5">學生班別</label>
                        <input type="text" id="inputClass" value="K3A 大班" oninput="renderWorksheet()" class="w-full text-xs px-3 py-2 border border-stone-300 rounded-lg bg-white">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-stone-500 uppercase tracking-wider mb-1.5">日期</label>
                        <input type="text" id="inputDate" value="" placeholder="YYYY/MM/DD" oninput="renderWorksheet()" class="w-full text-xs px-3 py-2 border border-stone-300 rounded-lg bg-white">
                    </div>
                </div>
            </div>

            <!-- Card 2: Layout Options -->
            <div class="bg-[#F9F8F6] p-5 rounded-xl border border-stone-200 shadow-sm space-y-4">
                <div class="flex items-center justify-between border-b border-stone-200 pb-2.5">
                    <h2 class="text-xs font-bold font-serif text-stone-700 tracking-wider uppercase flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-sage-600"></i> 字帖格式自訂
                    </h2>
                </div>

                <!-- Phonetics Mode -->
                <div>
                    <label class="block text-[11px] font-semibold text-stone-500 uppercase tracking-wider mb-1.5">讀音標註</label>
                    <select id="pinyinMode" onchange="renderWorksheet()" class="w-full text-xs px-3 py-2 border border-stone-300 rounded-lg bg-white focus:outline-none focus:border-sage-600">
                        <option value="jyutping" selected>粵語拼音 (wong4, si1, ham4)</option>
                        <option value="pinyin">漢語拼音 (wáng, shī, hán)</option>
                        <option value="zhuyin">注音符號 (ㄨㄤˊ, ㄕ, ㄏㄢˊ)</option>
                        <option value="none">不顯示讀音</option>
                    </select>
                </div>

                <!-- Grid Style & Colors -->
                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="block text-[11px] font-semibold text-stone-500 uppercase tracking-wider mb-1.5">字格線條</label>
                        <select id="gridStyle" onchange="renderWorksheet()" class="w-full text-xs px-2.5 py-2 border border-stone-300 rounded-lg bg-white">
                            <option value="mizige" selected>米字格 (推薦)</option>
                            <option value="tianzige">田字格</option>
                            <option value="jiugongge">九宮格</option>
                            <option value="none">無輔助線</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-stone-500 uppercase tracking-wider mb-1.5">字帖色彩</label>
                        <select id="colorTheme" onchange="renderWorksheet()" class="w-full text-xs px-2.5 py-2 border border-stone-300 rounded-lg bg-white">
                            <option value="green" selected>翡翠綠 (標準)</option>
                            <option value="red">硃砂紅 (傳統)</option>
                            <option value="blue">晴空藍 (雅緻)</option>
                            <option value="black">水墨黑 (簡約)</option>
                        </select>
                    </div>
                </div>

                <!-- Toggles -->
                <div class="space-y-2.5 pt-2 border-t border-stone-200 text-xs">
                    <label class="flex items-center justify-between cursor-pointer group">
                        <span class="text-stone-700 font-medium group-hover:text-stone-900">筆順拆解列 (步驟示範)</span>
                        <input type="checkbox" id="showStrokeBreakdown" checked onchange="renderWorksheet()" class="w-4 h-4 text-sage-600 rounded border-stone-300 focus:ring-sage-600">
                    </label>

                    <label class="flex items-center justify-between cursor-pointer group">
                        <span class="text-stone-700 font-medium group-hover:text-stone-900">超大例字標示</span>
                        <input type="checkbox" id="showBigSample" checked onchange="renderWorksheet()" class="w-4 h-4 text-sage-600 rounded border-stone-300 focus:ring-sage-600">
                    </label>

                    <label class="flex items-center justify-between cursor-pointer group">
                        <span class="text-stone-700 font-medium group-hover:text-stone-900">頁頭典雅點綴圖樣</span>
                        <input type="checkbox" id="showDecorations" checked onchange="renderWorksheet()" class="w-4 h-4 text-sage-600 rounded border-stone-300 focus:ring-sage-600">
                    </label>
                </div>

                <!-- Rows & Columns -->
                <div class="grid grid-cols-2 gap-2.5 pt-2 border-t border-stone-200">
                    <div>
                        <label class="block text-[11px] font-semibold text-stone-500 uppercase tracking-wider mb-1.5">每字描寫列數</label>
                        <select id="tracingRows" onchange="renderWorksheet()" class="w-full text-xs px-2.5 py-1.5 border border-stone-300 rounded-lg bg-white">
                            <option value="1">1 列</option>
                            <option value="2" selected>2 列</option>
                            <option value="3">3 列</option>
                            <option value="4">4 列</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-stone-500 uppercase tracking-wider mb-1.5">每列總格數</label>
                        <select id="colsPerRow" onchange="renderWorksheet()" class="w-full text-xs px-2.5 py-1.5 border border-stone-300 rounded-lg bg-white">
                            <option value="6">6 格</option>
                            <option value="7" selected>7 格</option>
                            <option value="8">8 格</option>
                            <option value="9">9 格</option>
                        </select>
                    </div>
                </div>

                <!-- Trace Opacity Slider -->
                <div class="pt-1">
                    <div class="flex justify-between text-[11px] font-semibold text-stone-500 uppercase tracking-wider mb-1">
                        <span>描紅深淺濃度</span>
                        <span id="opacityVal" class="text-stone-700 font-mono">22%</span>
                    </div>
                    <input type="range" id="traceOpacity" min="10" max="50" value="22" oninput="document.getElementById('opacityVal').innerText = this.value + '%'; renderWorksheet();" class="w-full accent-sage-600">
                </div>
            </div>

            <!-- Card 3: Custom Pronunciation Overrides -->
            <div class="bg-[#F9F8F6] p-5 rounded-xl border border-stone-200 shadow-sm space-y-3">
                <div class="flex items-center justify-between border-b border-stone-200 pb-2">
                    <h2 class="text-xs font-bold font-serif text-stone-700 tracking-wider uppercase flex items-center gap-2">
                        <i class="fa-solid fa-microphone text-sage-600"></i> 個別字讀音校對
                    </h2>
                    <span class="text-[10px] text-stone-400">可自訂修正</span>
                </div>
                <div id="pronunciationInputs" class="space-y-2">
                    <!-- Dynamic Pronunciation Editors injected here -->
                </div>
            </div>

            <!-- Print Tip Card -->
            <div class="bg-stone-200/50 border border-stone-300/60 p-4 rounded-xl text-xs text-stone-600 space-y-1 font-serif">
                <div class="font-bold text-stone-800 flex items-center gap-1.5">
                    <i class="fa-solid fa-circle-info text-sage-600"></i> 列印須知：
                </div>
                <p class="leading-relaxed text-[11px] text-stone-600">點擊「列印字帖」，將目標選擇為<b>「另存為 PDF」</b>，並將頁邊距設定為<b>「無」</b>，即可輸出高品質標準 A4 練習頁。</p>
            </div>
        </aside>

        <!-- Worksheet Live Preview Canvas Area -->
        <main class="lg:col-span-8 flex flex-col items-center justify-start overflow-x-auto pb-12">

            <!-- Floating Preview Status -->
            <div class="no-print mb-4 flex items-center space-x-3 bg-white px-4 py-2 rounded-full border border-stone-200 shadow-sm text-xs text-stone-600">
                <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> 即時 A4 頁面預覽</span>
                <span class="text-stone-300">|</span>
                <span id="charCountTag" class="font-serif font-bold text-stone-800">3 個字</span>
            </div>

            <!-- Paper Sheet Workspace -->
            <div id="worksheetPaper" class="a4-paper print-area rounded p-8 sm:p-10 border border-stone-200 transition-all">
                
                <!-- Header Title Section -->
                <div id="worksheetHeader" class="text-center mb-6 relative border-b pb-4 border-stone-200">
                    <div id="decorLeft" class="absolute left-2 top-0 text-stone-400 opacity-80">
                        <i class="fa-solid fa-star text-lg"></i>
                    </div>
                    <div id="decorRight" class="absolute right-2 top-0 text-stone-400 opacity-80">
                        <i class="fa-solid fa-pen-nib text-lg"></i>
                    </div>

                    <h1 id="headerSubtitle" class="text-2xl font-bold tracking-widest font-kaiti mb-1 text-stone-800">
                        全名筆順寫字帖
                    </h1>
                    <div id="headerTagline" class="text-[11px] font-serif text-stone-500 tracking-wider uppercase">
                        一筆一劃 ‧ 寫好名字
                    </div>

                    <!-- Student Info Bar -->
                    <div class="mt-5 flex flex-wrap justify-between items-center text-xs font-serif text-stone-700 px-2 gap-y-2">
                        <div class="flex items-center gap-1">
                            <span class="whitespace-nowrap text-stone-500">姓名：</span>
                            <div class="border-b border-stone-400 px-3 text-center min-w-[100px] h-6 flex items-center justify-center font-bold text-stone-900 font-kaiti">
                                <span id="displayName">王詩涵</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-1">
                            <span class="whitespace-nowrap text-stone-500">班別：</span>
                            <div class="border-b border-stone-400 px-3 text-center min-w-[90px] h-6 flex items-center justify-center font-kaiti">
                                <span id="displayClass">K3A 大班</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-1">
                            <span class="whitespace-nowrap text-stone-500">日期：</span>
                            <div class="border-b border-stone-400 px-3 text-center min-w-[110px] h-6 flex items-center justify-center font-kaiti">
                                <span id="displayDate">____/____/____</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Dynamic Character Blocks Container -->
                <div id="characterBlocksContainer" class="space-y-5">
                    <!-- Dynamic character practice sections injected here -->
                </div>

                <!-- Footer Page Label -->
                <div class="mt-8 text-center text-[10px] text-stone-400 border-t border-stone-200 pt-3 flex justify-between items-center font-serif">
                    <span>標準繁體楷體筆順字帖 ‧ 繁體字學習練習</span>
                    <span>頁碼 1 / 1</span>
                </div>

            </div>
        </main>
    </div>

    <!-- Modal: Stroke Order Animation Player -->
    <div id="animModal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4 relative border border-stone-200">
            <button onclick="toggleAnimationModal()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-600 text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="text-center">
                <h3 class="text-base font-bold font-serif text-stone-800 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-600"></i> 動態筆順示範
                </h3>
                <p class="text-xs text-stone-500 mt-0.5">點擊下方漢字觀看標準楷體筆順動畫</p>
            </div>

            <!-- Selected Character Tabs -->
            <div id="animCharTabs" class="flex justify-center gap-2 border-b border-stone-100 pb-3">
                <!-- Tabs inserted dynamically -->
            </div>

            <!-- HanziWriter Animation Canvas Container -->
            <div class="flex justify-center my-3">
                <div id="hanziWriterTarget" class="w-60 h-60 border border-stone-200 rounded-xl bg-stone-50 flex items-center justify-center shadow-inner relative">
                    <!-- Target element for HanziWriter -->
                </div>
            </div>

            <!-- Controls -->
            <div class="flex justify-center gap-2.5">
                <button onclick="playStrokeAnimation()" class="bg-sage-600 hover:bg-sage-700 text-white px-4 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-play"></i> 重播動畫
                </button>
                <button onclick="animateStrokeStepByStep()" class="bg-stone-100 hover:bg-stone-200 text-stone-700 border border-stone-300 px-4 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-forward-step"></i> 逐筆演練
                </button>
            </div>
        </div>
    </div>

    <script>
        // 1. Theme Configurations
        const THEMES = {
            green: {
                titleColor: 'text-sage-800',
                accentBadge: 'bg-sage-100 text-sage-800 border border-sage-200',
                gridBorder: '#3E5C4A',
                gridDash: '#A3B899',
                strokeColor: '#334C3D',
                activeStrokeColor: '#D97706'
            },
            red: {
                titleColor: 'text-rose-900',
                accentBadge: 'bg-rose-100 text-rose-800 border border-rose-200',
                gridBorder: '#9F1239',
                gridDash: '#F43F5E',
                strokeColor: '#881337',
                activeStrokeColor: '#D97706'
            },
            blue: {
                titleColor: 'text-sky-900',
                accentBadge: 'bg-sky-100 text-sky-800 border border-sky-200',
                gridBorder: '#0369A1',
                gridDash: '#38BDF8',
                strokeColor: '#0C4A6E',
                activeStrokeColor: '#D97706'
            },
            black: {
                titleColor: 'text-stone-900',
                accentBadge: 'bg-stone-200 text-stone-800 border border-stone-300',
                gridBorder: '#27272A',
                gridDash: '#71717A',
                strokeColor: '#18181B',
                activeStrokeColor: '#D97706'
            }
        };

        // 2. Comprehensive Pronunciation Dictionary
        const DICT = {
            '王': { jyutping: 'wong4', pinyin: 'wáng', zhuyin: 'ㄨㄤˊ' },
            '詩': { jyutping: 'si1', pinyin: 'shī', zhuyin: 'ㄕ' },
            '涵': { jyutping: 'ham4', pinyin: 'hán', zhuyin: 'ㄏㄢˊ' },
            '陳': { jyutping: 'can4', pinyin: 'chén', zhuyin: 'ㄔㄣˊ' },
            '樂': { jyutping: 'lok6', pinyin: 'yuè', zhuyin: 'ㄩㄝˋ' },
            '軒': { jyutping: 'hin1', pinyin: 'xuān', zhuyin: 'ㄒㄨㄢ' },
            '張': { jyutping: 'zoeng1', pinyin: 'zhāng', zhuyin: 'ㄓㄤ' },
            '梓': { jyutping: 'zi2', pinyin: 'zǐ', zhuyin: 'ㄗˇ' },
            '童': { jyutping: 'tung4', pinyin: 'tóng', zhuyin: 'ㄊㄨㄥˊ' },
            '李': { jyutping: 'lei5', pinyin: 'lǐ', zhuyin: 'ㄌㄧˇ' },
            '嘉': { jyutping: 'gaa1', pinyin: 'jiā', zhuyin: 'ㄐㄧㄚ' },
            '欣': { jyutping: 'jan1', pinyin: 'xīn', zhuyin: 'ㄒㄧㄣ' },
            '黃': { jyutping: 'wong4', pinyin: 'huáng', zhuyin: 'ㄏㄨㄤˊ' },
            '林': { jyutping: 'lam4', pinyin: 'lín', zhuyin: 'ㄌㄧㄣˊ' },
            '劉': { jyutping: 'lau4', pinyin: 'liú', zhuyin: 'ㄌㄧㄡˊ' },
            '吳': { jyutping: 'ng4', pinyin: 'wú', zhuyin: 'ㄨˊ' },
            '蔡': { jyutping: 'coi3', pinyin: 'cài', zhuyin: 'ㄘㄞˋ' },
            '楊': { jyutping: 'joeng4', pinyin: 'yáng', zhuyin: 'ㄧㄤˊ' },
            '許': { jyutping: 'heoi2', pinyin: 'xǔ', zhuyin: 'ㄒㄩˇ' },
            '鄭': { jyutping: 'zing6', pinyin: 'zhèng', zhuyin: 'ㄓㄥˋ' },
            '謝': { jyutping: 'ze6', pinyin: 'xiè', zhuyin: 'ㄒㄧㄝˋ' },
            '郭': { jyutping: 'gwok3', pinyin: 'guō', zhuyin: 'ㄍㄨㄛ' },
            '曾': { jyutping: 'zang1', pinyin: 'zēng', zhuyin: 'ㄗㄥ' },
            '邱': { jyutping: 'jau1', pinyin: 'qiū', zhuyin: 'ㄑㄧㄡ' },
            '廖': { jyutping: 'liu6', pinyin: 'liào', zhuyin: 'ㄌㄧㄠˋ' },
            '賴': { jyutping: 'laai6', pinyin: 'lài', zhuyin: 'ㄌㄞˋ' }
        };

        const customPronunciations = {};
        const strokeDataCache = {};
        let currentAnimWriter = null;
        let activeAnimChar = '';

        function setSampleName(name) {
            document.getElementById('inputName').value = name;
            renderWorksheet();
        }

        function getPronunciation(char, mode, index) {
            if (customPronunciations[index] !== undefined && customPronunciations[index] !== '') {
                return customPronunciations[index];
            }
            if (DICT[char] && DICT[char][mode]) {
                return DICT[char][mode];
            }
            return mode === 'none' ? '' : char;
        }

        function updatePronunciationEditors(characters, pinyinMode) {
            const container = document.getElementById('pronunciationInputs');
            container.innerHTML = '';

            if (pinyinMode === 'none') {
                container.innerHTML = `<span class="text-xs text-stone-400 italic">模式為不顯示讀音</span>`;
                return;
            }

            characters.forEach((char, idx) => {
                const row = document.createElement('div');
                row.className = 'flex items-center gap-2 text-xs';
                
                const currentVal = customPronunciations[idx] !== undefined 
                    ? customPronunciations[idx] 
                    : (DICT[char] ? DICT[char][pinyinMode] : '');

                row.innerHTML = `
                    <span class="font-serif font-bold w-6 text-stone-700">${char}:</span>
                    <input type="text" value="${currentVal}" 
                        oninput="customPronunciations[${idx}] = this.value; renderWorksheet();"
                        class="flex-1 text-xs px-2 py-1 border border-stone-300 rounded focus:border-sage-600 focus:outline-none bg-white">
                `;
                container.appendChild(row);
            });
        }

        async function fetchCharStrokeData(char) {
            if (strokeDataCache[char]) return strokeDataCache[char];
            
            try {
                const response = await fetch(`https://cdn.jsdelivr.net/npm/hanzi-writer-data@2.0/${char}.json`);
                if (!response.ok) throw new Error('Not found');
                const data = await response.json();
                strokeDataCache[char] = data;
                return data;
            } catch (err) {
                console.warn(`Stroke data missing for ${char}`, err);
                return null;
            }
        }

        function getGridLinesSVG(width, height, style, theme) {
            if (style === 'none') return '';

            const dashAttr = `stroke="${theme.gridDash}" stroke-dasharray="3,3" stroke-width="1"`;
            const solidAttr = `stroke="${theme.gridBorder}" stroke-width="1.5"`;

            let svg = `<rect x="0" y="0" width="${width}" height="${height}" fill="none" ${solidAttr}/>`;

            if (style === 'tianzige' || style === 'mizige') {
                svg += `
                    <line x1="${width/2}" y1="0" x2="${width/2}" y2="${height}" ${dashAttr}/>
                    <line x1="0" y1="${height/2}" x2="${width}" y2="${height/2}" ${dashAttr}/>
                `;
            }

            if (style === 'mizige') {
                svg += `
                    <line x1="0" y1="0" x2="${width}" y2="${height}" ${dashAttr}/>
                    <line x1="${width}" y1="0" x2="0" y2="${height}" ${dashAttr}/>
                `;
            }

            if (style === 'jiugongge') {
                const w1 = width / 3;
                const w2 = (width / 3) * 2;
                const h1 = height / 3;
                const h2 = (height / 3) * 2;
                svg += `
                    <line x1="${w1}" y1="0" x2="${w1}" y2="${height}" ${dashAttr}/>
                    <line x1="${w2}" y1="0" x2="${w2}" y2="${height}" ${dashAttr}/>
                    <line x1="0" y1="${h1}" x2="${width}" y2="${h1}" ${dashAttr}/>
                    <line x1="0" y1="${h2}" x2="${width}" y2="${h2}" ${dashAttr}/>
                `;
            }

            return svg;
        }

        function createStepStrokeSVG(strokes, currentStep, gridStyle, theme) {
            const container = document.createElement('div');
            container.className = 'w-8 h-8 rounded border flex-shrink-0 relative overflow-hidden bg-white';
            container.style.borderColor = theme.gridBorder;

            const gridLines = getGridLinesSVG(100, 100, gridStyle, theme);

            let strokePaths = '';
            for (let i = 0; i < currentStep; i++) {
                const color = (i === currentStep - 1) ? theme.activeStrokeColor : theme.strokeColor;
                strokePaths += `<path d="${strokes[i]}" fill="${color}" transform="scale(0.09, -0.09) translate(0, -900)"/>`;
            }

            container.innerHTML = `
                <svg viewBox="0 0 100 100" class="w-full h-full block">
                    ${gridLines}
                    <g transform="translate(5, 5)">
                        ${strokePaths}
                    </g>
                    <text x="92" y="92" font-size="18" fill="#a1a1aa" text-anchor="end" font-family="sans-serif">${currentStep}</text>
                </svg>
            `;

            return container;
        }

        function createGridCellSVG(char, gridStyle, theme, traceOpacity = 0, isBigSample = false, customClass = 'w-14 h-14') {
            const cell = document.createElement('div');
            cell.className = `relative rounded flex-shrink-0 flex items-center justify-center bg-white overflow-hidden ${customClass}`;
            cell.style.borderColor = theme.gridBorder;

            const gridLines = getGridLinesSVG(100, 100, gridStyle, theme);

            let textSVG = '';
            if (char && (isBigSample || traceOpacity > 0)) {
                const fontSize = isBigSample ? '62' : '52';
                const opacity = isBigSample ? '1.0' : traceOpacity.toString();
                const fill = isBigSample ? '#1c1917' : '#292524';
                
                // SVG Vector Text with precise middle baseline alignment
                textSVG = `
                    <text x="50" y="52" 
                          text-anchor="middle" 
                          dominant-baseline="central" 
                          font-family="標楷體, BiauKai, DFKai-SB, KaiTi, 'Noto Serif TC', serif" 
                          font-size="${fontSize}" 
                          font-weight="bold" 
                          fill="${fill}" 
                          fill-opacity="${opacity}">${char}</text>
                `;
            }

            cell.innerHTML = `
                <svg viewBox="0 0 100 100" class="w-full h-full block pointer-events-none">
                    ${gridLines}
                    ${textSVG}
                </svg>
            `;

            return cell;
        }

        async function renderWorksheet() {
            const name = document.getElementById('inputName').value.trim() || '王詩涵';
            const subtitle = document.getElementById('inputSubtitle').value.trim() || '全名筆順寫字帖';
            const studentClass = document.getElementById('inputClass').value.trim();
            const dateStr = document.getElementById('inputDate').value.trim();

            const pinyinMode = document.getElementById('pinyinMode').value;
            const gridStyle = document.getElementById('gridStyle').value;
            const themeKey = document.getElementById('colorTheme').value;
            const showBreakdown = document.getElementById('showStrokeBreakdown').checked;
            const showBigSample = document.getElementById('showBigSample').checked;
            const showDecorations = document.getElementById('showDecorations').checked;
            const tracingRows = parseInt(document.getElementById('tracingRows').value, 10);
            const colsPerRow = parseInt(document.getElementById('colsPerRow').value, 10);
            const traceOpacity = parseFloat(document.getElementById('traceOpacity').value) / 100;

            const theme = THEMES[themeKey] || THEMES.green;

            // Update Sheet Header Text
            document.getElementById('headerSubtitle').className = `text-2xl font-bold tracking-widest font-kaiti mb-1 ${theme.titleColor}`;
            document.getElementById('headerSubtitle').innerText = subtitle;
            document.getElementById('displayName').innerText = name;
            document.getElementById('displayClass').innerText = studentClass || '____';
            document.getElementById('displayDate').innerText = dateStr || '____/____/____';

            // Toggle Decorations
            document.getElementById('decorLeft').style.display = showDecorations ? 'block' : 'none';
            document.getElementById('decorRight').style.display = showDecorations ? 'block' : 'none';

            // Character count tag
            const characters = Array.from(name).filter(c => c.trim().length > 0);
            document.getElementById('charCountTag').innerText = `${characters.length} 個字`;

            // Pronunciation Input Editors
            updatePronunciationEditors(characters, pinyinMode);

            // Container for worksheet blocks
            const container = document.getElementById('characterBlocksContainer');
            container.innerHTML = '';

            for (let i = 0; i < characters.length; i++) {
                const char = characters[i];
                const pronText = getPronunciation(char, pinyinMode, i);

                const blockEl = document.createElement('div');
                blockEl.className = 'border rounded-lg p-3.5 relative bg-white transition';
                blockEl.style.borderColor = theme.gridBorder;

                // 1. Pronunciation & Char Header
                let headerHTML = `
                    <div class="flex items-center gap-3 mb-2.5">
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded ${theme.accentBadge}">字 ${i + 1}</span>
                        ${pinyinMode !== 'none' ? `<span class="text-xs font-semibold text-stone-700 tracking-wider font-mono">${pronText}</span>` : ''}
                        <button onclick="openAnimForChar('${char}')" class="no-print text-[11px] text-amber-700 hover:text-amber-800 font-medium ml-auto flex items-center gap-1">
                            <i class="fa-solid fa-play-circle text-xs"></i> 播放動畫
                        </button>
                    </div>
                `;

                blockEl.innerHTML = headerHTML;

                // 2. Stroke Order Breakdown Row
                if (showBreakdown) {
                    const breakdownWrapper = document.createElement('div');
                    breakdownWrapper.className = 'mb-3 pb-2.5 border-b border-dashed';
                    breakdownWrapper.style.borderColor = theme.gridDash;

                    const breakdownTitle = document.createElement('div');
                    breakdownTitle.className = 'text-[10px] font-semibold text-stone-500 mb-1.5 flex items-center gap-1 font-serif';
                    breakdownTitle.innerHTML = `<i class="fa-solid fa-list-ol text-stone-400"></i> 全字筆順拆解步驟：`;
                    breakdownWrapper.appendChild(breakdownTitle);

                    const strokesContainer = document.createElement('div');
                    strokesContainer.className = 'flex flex-wrap gap-1.5 items-center';
                    
                    const strokeData = await fetchCharStrokeData(char);
                    if (strokeData && strokeData.strokes && strokeData.strokes.length > 0) {
                        const totalStrokes = strokeData.strokes.length;
                        for (let s = 1; s <= totalStrokes; s++) {
                            const stepSvg = createStepStrokeSVG(strokeData.strokes, s, gridStyle, theme);
                            strokesContainer.appendChild(stepSvg);
                        }
                    } else {
                        strokesContainer.innerHTML = `<span class="text-xs text-stone-400 italic">載入筆順資料中...</span>`;
                    }
                    breakdownWrapper.appendChild(strokesContainer);
                    blockEl.appendChild(breakdownWrapper);
                }

                // 3. Grid Row Layout (Scaled & Proportionate)
                const contentRow = document.createElement('div');
                contentRow.className = 'flex items-stretch gap-3 overflow-x-auto';

                // Single grid size standard
                const uniformCellClass = 'w-14 h-14';

                // Left side big sample cell
                if (showBigSample) {
                    const bigCellWrapper = document.createElement('div');
                    
                    // Match height dynamically if tracingRows > 1
                    let bigCellDimensionClass = uniformCellClass;
                    if (tracingRows === 2) bigCellDimensionClass = 'w-[120px] h-[120px]';
                    else if (tracingRows === 3) bigCellDimensionClass = 'w-[180px] h-[180px]';
                    else if (tracingRows === 4) bigCellDimensionClass = 'w-[240px] h-[240px]';

                    bigCellWrapper.className = 'flex-shrink-0 flex items-center justify-center';
                    const bigCell = createGridCellSVG(char, gridStyle, theme, 1.0, true, bigCellDimensionClass);
                    bigCellWrapper.appendChild(bigCell);
                    contentRow.appendChild(bigCellWrapper);
                }

                // Right side practice grid rows
                const gridRowsContainer = document.createElement('div');
                gridRowsContainer.className = 'flex-1 flex flex-col justify-between space-y-2';

                const totalTraceCols = showBigSample ? colsPerRow - 1 : colsPerRow;

                for (let r = 0; r < tracingRows; r++) {
                    const rowEl = document.createElement('div');
                    rowEl.className = 'flex items-center gap-2 justify-start';

                    for (let c = 0; c < totalTraceCols; c++) {
                        const isTrace = c < Math.ceil(totalTraceCols * 0.6);
                        const cellOpacity = isTrace ? traceOpacity : 0;
                        const cell = createGridCellSVG(char, gridStyle, theme, cellOpacity, false, uniformCellClass);
                        rowEl.appendChild(cell);
                    }

                    gridRowsContainer.appendChild(rowEl);
                }

                contentRow.appendChild(gridRowsContainer);
                blockEl.appendChild(contentRow);
                container.appendChild(blockEl);
            }
        }

        function toggleAnimationModal() {
            const modal = document.getElementById('animModal');
            modal.classList.toggle('hidden');

            if (!modal.classList.contains('hidden')) {
                const name = document.getElementById('inputName').value.trim() || '王詩涵';
                const chars = Array.from(name).filter(c => c.trim().length > 0);
                
                const tabsContainer = document.getElementById('animCharTabs');
                tabsContainer.innerHTML = '';

                chars.forEach((c, idx) => {
                    const btn = document.createElement('button');
                    btn.className = `px-3 py-1 text-xs rounded-lg font-serif transition ${idx === 0 ? 'bg-sage-600 text-white font-bold' : 'bg-stone-100 text-stone-700 hover:bg-stone-200'}`;
                    btn.innerText = c;
                    btn.onclick = () => {
                        Array.from(tabsContainer.children).forEach(b => {
                            b.className = 'px-3 py-1 text-xs rounded-lg font-serif transition bg-stone-100 text-stone-700 hover:bg-stone-200';
                        });
                        btn.className = 'px-3 py-1 text-xs rounded-lg font-serif transition bg-sage-600 text-white font-bold';
                        loadHanziWriterChar(c);
                    };
                    tabsContainer.appendChild(btn);
                });

                if (chars.length > 0) {
                    loadHanziWriterChar(chars[0]);
                }
            }
        }

        function openAnimForChar(char) {
            const modal = document.getElementById('animModal');
            if (modal.classList.contains('hidden')) {
                toggleAnimationModal();
            }
            loadHanziWriterChar(char);
        }

        function loadHanziWriterChar(char) {
            activeAnimChar = char;
            const target = document.getElementById('hanziWriterTarget');
            target.innerHTML = '';

            const themeKey = document.getElementById('colorTheme').value;
            const theme = THEMES[themeKey] || THEMES.green;

            currentAnimWriter = HanziWriter.create('hanziWriterTarget', char, {
                width: 220,
                height: 220,
                padding: 10,
                showOutline: true,
                strokeColor: theme.strokeColor,
                radialColor: theme.gridDash,
                delayBetweenStrokes: 250
            });

            currentAnimWriter.animateCharacter();
        }

        function playStrokeAnimation() {
            if (currentAnimWriter) {
                currentAnimWriter.animateCharacter();
            }
        }

        function animateStrokeStepByStep() {
            if (currentAnimWriter) {
                currentAnimWriter.loopCharacterAnimation();
            }
        }

        function triggerPrint() {
            window.print();
        }

        function exportImage() {
            const paper = document.getElementById('worksheetPaper');
            
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-5 right-5 bg-stone-800 text-white text-xs px-4 py-3 rounded-xl shadow-xl z-50 flex items-center gap-2 font-serif';
            toast.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-amber-400 text-sm"></i> 正在生成高解析度字帖圖片...`;
            document.body.appendChild(toast);

            html2canvas(paper, {
                scale: 2,
                useCORS: true,
                allowTaint: true,
                backgroundColor: '#ffffff',
                logging: false,
                onclone: (clonedDoc) => {
                    const clonedPaper = clonedDoc.getElementById('worksheetPaper');
                    if (clonedPaper) {
                        clonedPaper.style.transform = 'none';
                        clonedPaper.style.boxShadow = 'none';
                    }
                }
            }).then(canvas => {
                const link = document.createElement('a');
                const name = document.getElementById('inputName').value.trim() || '姓名字帖';
                link.download = `${name}_筆順練習字帖.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                if (document.body.contains(toast)) document.body.removeChild(toast);
            }).catch(err => {
                console.error('Image export failed:', err);
                toast.className = 'fixed bottom-5 right-5 bg-rose-700 text-white text-xs px-4 py-3 rounded-xl shadow-xl z-50';
                toast.innerHTML = `圖片生成失敗，請使用「列印字帖」另存為 PDF。`;
                setTimeout(() => {
                    if (document.body.contains(toast)) document.body.removeChild(toast);
                }, 3000);
            });
        }

        // Initial render on window load
        window.onload = function() {
            renderWorksheet();
        };
    </script>
</body>
</html>
