<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>繁體中文姓名筆順字帖生成器</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- HanziWriter for Chinese stroke order vectors & animation -->
    <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- html2canvas for image export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Google Fonts: Noto Serif TC for elegant Chinese typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        paper: '#F7F6F2',
                        ink: {
                            50: '#f6f6f6',
                            100: '#e7e7e7',
                            700: '#333333',
                            800: '#222222',
                            900: '#111111',
                        },
                        sage: {
                            50: '#f4f7f4',
                            100: '#e3ece4',
                            600: '#3e5c4a',
                            700: '#334c3d',
                            800: '#283c30',
                        }
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                        kaiti: ['"標楷體"', '"BiauKai"', '"DFKai-SB"', '"KaiTi"', '"Noto Serif TC"', 'serif']
                    }
                }
            }
        }
    </script>

    <style>
        /* Printable Page Constraints */
        @media print {
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .no-print {
                display: none !important;
            }
            .print-area {
                box-shadow: none !important;
                margin: 0 !important;
                width: 100% !important;
                max-width: 100% !important;
                border: none !important;
                padding: 8mm !important;
            }
            @page {
                size: A4 portrait;
                margin: 0;
            }
        }

        /* Paper preview styling */
        .a4-paper {
            width: 210mm;
            min-height: 297mm;
            background: #ffffff;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06), 0 1px 3px rgba(0, 0, 0, 0.03);
            margin: 0 auto;
            position: relative;
        }

        /* Smooth scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        ::-webkit-scrollbar-thumb {
            background: #d1d5db;
            border-radius: 99px;
        }
    </style>
</head>
<body class="bg-[#F5F3EF] text-stone-800 font-sans min-h-screen flex flex-col antialiased">

    <!-- Top Navigation Header -->
    <header class="bg-white/90 backdrop-blur-md border-b border-stone-200/80 text-stone-800 sticky top-0 z-40 no-print">
        <div class="max-w-7xl mx-auto px-6 py-3.5 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3.5">
                <div class="w-10 h-10 bg-sage-600 text-white rounded-xl flex items-center justify-center font-serif text-xl font-bold shadow-sm">
                    字
                </div>
                <div>
                    <h1 class="text-base font-bold font-serif text-stone-800 tracking-wide flex items-center gap-2">
                        繁體中文姓名筆順字帖生成器
                        <span class="text-[10px] bg-stone-100 text-stone-600 border border-stone-200 font-sans font-normal px-2 py-0.5 rounded-full">標準楷體</span>
                    </h1>
                    <p class="text-xs text-stone-500 font-light">一筆一劃引導學習 ‧ 自動拆解筆順練習帖</p>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex items-center space-x-2.5">
                <button onclick="triggerPrint()" class="bg-sage-600 hover:bg-sage-700 text-white px-4 py-2 rounded-lg text-xs font-semibold transition-all flex items-center shadow-sm">
                    <i class="fa-solid fa-print mr-2 opacity-90"></i> 列印字帖 (PDF)
                </button>
                <button onclick="exportImage()" class="bg-stone-100 hover:bg-stone-200 text-stone-700 border border-stone-200 px-3.5 py-2 rounded-lg text-xs font-medium transition">
                    <i class="fa-solid fa-download mr-1.5 text-stone-500"></i> 匯出圖片
                </button>
                <button onclick="toggleAnimationModal()" class="bg-amber-50 hover:bg-amber-100 text-amber-800 border border-amber-200 px-3.5 py-2 rounded-lg text-xs font-medium transition">
                    <i class="fa-solid fa-play mr-1.5 text-amber-600"></i> 筆順動畫
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Split Layout -->
    <div class="max-w-7xl mx-auto w-full flex-1 p-4 md:p-6 grid grid-cols-1 lg:grid-cols-12 gap-8">

        <!-- Sidebar Control Panel -->
        <aside class="lg:col-span-4 space-y-4 no-print">

            <!-- Card 1: Basic Input Controls -->
            <div class="bg-white p-5 rounded-xl border border-stone-200/80 shadow-sm space-y-4">
                <div class="flex items-center justify-between border-b border-stone-100 pb-3">
                    <h2 class="text-xs font-bold font-serif text-stone-700 tracking-wider uppercase flex items-center gap-2">
                        <i class="fa-solid fa-pen-nib text-sage-600"></i> 姓名與標題設定
                    </h2>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-stone-500 uppercase tracking-wider mb-1.5">繁體中文姓名</label>
                    <input type="text" id="inputName" value="王詩涵" placeholder="請輸入姓名 (如：王詩涵)" 
                        oninput="renderWorksheet()"
                        class="w-full text-lg font-serif font-bold px-3.5 py-2 border border-stone-200 rounded-lg focus:border-sage-600 focus:ring-1 focus:ring-sage-600 focus:outline-none transition tracking-widest text-center bg-stone-50/50">
                    <div class="flex gap-2 mt-2 items-center">
                        <span class="text-[11px] text-stone-400">範例：</span>
                        <button onclick="setSampleName('王詩涵')" class="text-xs text-sage-600 hover:underline">王詩涵</button>
                        <button onclick="setSampleName('陳樂軒')" class="text-xs text-sage-600 hover:underline">陳樂軒</button>
                        <button onclick="setSampleName('張梓童')" class="text-xs text-sage-600 hover:underline">張梓童</button>
                        <button onclick="setSampleName('李嘉欣')" class="text-xs text-sage-600 hover:underline">李嘉欣</button>
                    </div>
                </div>

                <div>
                    <label class="block text-[11px] font-semibold text-stone-500 uppercase tracking-wider mb-1.5">字帖頁頭標題</label>
                    <input type="text" id="inputSubtitle" value="全名筆順寫字帖" placeholder="字帖標題" 
                        oninput="renderWorksheet()"
                        class="w-full text-xs px-3 py-2 border border-stone-200 rounded-lg focus:border-sage-600 focus:outline-none bg-stone-50/30">
                </div>

                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="block text-[11px] font-semibold text-stone-500 uppercase tracking-wider mb-1.5">學生班別</label>
                        <input type="text" id="inputClass" value="K3A 大班" oninput="renderWorksheet()" class="w-full text-xs px-3 py-2 border border-stone-200 rounded-lg bg-stone-50/30">
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-stone-500 uppercase tracking-wider mb-1.5">日期</label>
                        <input type="text" id="inputDate" value="" placeholder="YY/MM/DD" oninput="renderWorksheet()" class="w-full text-xs px-3 py-2 border border-stone-200 rounded-lg bg-stone-50/30">
                    </div>
                </div>
            </div>

            <!-- Card 2: Layout & Style Tuning -->
            <div class="bg-white p-5 rounded-xl border border-stone-200/80 shadow-sm space-y-4">
                <div class="flex items-center justify-between border-b border-stone-100 pb-3">
                    <h2 class="text-xs font-bold font-serif text-stone-700 tracking-wider uppercase flex items-center gap-2">
                        <i class="fa-solid fa-sliders text-sage-600"></i> 字帖格式自訂
                    </h2>
                </div>

                <!-- Phonetics Mode -->
                <div>
                    <label class="block text-[11px] font-semibold text-stone-500 uppercase tracking-wider mb-1.5">讀音標註</label>
                    <select id="pinyinMode" onchange="renderWorksheet()" class="w-full text-xs px-3 py-2 border border-stone-200 rounded-lg bg-stone-50/50 focus:outline-none focus:border-sage-600">
                        <option value="pinyin" selected>漢語拼音 (wáng, shī, hán)</option>
                        <option value="jyutping">粵語拼音 (wong4, si1, ham4)</option>
                        <option value="zhuyin">注音符號 (ㄨㄤˊ, ㄕ, ㄏㄢˊ)</option>
                        <option value="none">不顯示讀音</option>
                    </select>
                </div>

                <!-- Grid Style & Colors -->
                <div class="grid grid-cols-2 gap-2.5">
                    <div>
                        <label class="block text-[11px] font-semibold text-stone-500 uppercase tracking-wider mb-1.5">字格線條</label>
                        <select id="gridStyle" onchange="renderWorksheet()" class="w-full text-xs px-2.5 py-2 border border-stone-200 rounded-lg bg-stone-50/50">
                            <option value="mizige" selected>米字格 (推薦)</option>
                            <option value="tianzige">田字格</option>
                            <option value="jiugongge">九宮格</option>
                            <option value="none">無輔助線</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-stone-500 uppercase tracking-wider mb-1.5">字帖色彩</label>
                        <select id="colorTheme" onchange="renderWorksheet()" class="w-full text-xs px-2.5 py-2 border border-stone-200 rounded-lg bg-stone-50/50">
                            <option value="green" selected>翡翠綠 (標準)</option>
                            <option value="red">硃砂紅 (傳統)</option>
                            <option value="blue">晴空藍 (雅緻)</option>
                            <option value="black">水墨黑 (簡約)</option>
                        </select>
                    </div>
                </div>

                <!-- Toggles -->
                <div class="space-y-2.5 pt-2 border-t border-stone-100 text-xs">
                    <label class="flex items-center justify-between cursor-pointer group">
                        <span class="text-stone-700 font-medium group-hover:text-stone-900">筆順拆解列 (步驟示範)</span>
                        <input type="checkbox" id="showStrokeBreakdown" checked onchange="renderWorksheet()" class="w-4 h-4 text-sage-600 rounded border-stone-300 focus:ring-sage-600">
                    </label>

                    <label class="flex items-center justify-between cursor-pointer group">
                        <span class="text-stone-700 font-medium group-hover:text-stone-900">超大例字標示</span>
                        <input type="checkbox" id="showBigSample" checked onchange="renderWorksheet()" class="w-4 h-4 text-sage-600 rounded border-stone-300 focus:ring-sage-600">
                    </label>

                    <label class="flex items-center justify-between cursor-pointer group">
                        <span class="text-stone-700 font-medium group-hover:text-stone-900">頁頭童趣點綴圖樣</span>
                        <input type="checkbox" id="showDecorations" checked onchange="renderWorksheet()" class="w-4 h-4 text-sage-600 rounded border-stone-300 focus:ring-sage-600">
                    </label>
                </div>

                <!-- Rows & Columns -->
                <div class="grid grid-cols-2 gap-2.5 pt-2 border-t border-stone-100">
                    <div>
                        <label class="block text-[11px] font-semibold text-stone-500 uppercase tracking-wider mb-1.5">每字描寫列數</label>
                        <select id="tracingRows" onchange="renderWorksheet()" class="w-full text-xs px-2.5 py-1.5 border border-stone-200 rounded-lg bg-stone-50/30">
                            <option value="1">1 列</option>
                            <option value="2" selected>2 列</option>
                            <option value="3">3 列</option>
                            <option value="4">4 列</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] font-semibold text-stone-500 uppercase tracking-wider mb-1.5">每列總格數</label>
                        <select id="colsPerRow" onchange="renderWorksheet()" class="w-full text-xs px-2.5 py-1.5 border border-stone-200 rounded-lg bg-stone-50/30">
                            <option value="6">6 格</option>
                            <option value="7" selected>7 格</option>
                            <option value="8">8 格</option>
                            <option value="9">9 格</option>
                        </select>
                    </div>
                </div>

                <!-- Trace Opacity Slider -->
                <div class="pt-1">
                    <div class="flex justify-between text-[11px] font-semibold text-stone-500 uppercase tracking-wider mb-1">
                        <span>描紅深淺濃度</span>
                        <span id="opacityVal" class="text-stone-700 font-mono">25%</span>
                    </div>
                    <input type="range" id="traceOpacity" min="10" max="60" value="25" oninput="document.getElementById('opacityVal').innerText = this.value + '%'; renderWorksheet();" class="w-full accent-sage-600">
                </div>
            </div>

            <!-- Card 3: Custom Pronunciation Overrides -->
            <div class="bg-white p-5 rounded-xl border border-stone-200/80 shadow-sm space-y-3">
                <div class="flex items-center justify-between border-b border-stone-100 pb-2">
                    <h2 class="text-xs font-bold font-serif text-stone-700 tracking-wider uppercase flex items-center gap-2">
                        <i class="fa-solid fa-microphone text-sage-600"></i> 個別字讀音校對
                    </h2>
                    <span class="text-[10px] text-stone-400">可自訂修正</span>
                </div>
                <div id="pronunciationInputs" class="space-y-2">
                    <!-- Pronunciation Inputs Injected Here -->
                </div>
            </div>

            <!-- Print Tip Card -->
            <div class="bg-stone-200/50 border border-stone-300/50 p-4 rounded-xl text-xs text-stone-600 space-y-1">
                <div class="font-bold text-stone-800 flex items-center gap-1.5 font-serif">
                    <i class="fa-solid fa-circle-info text-sage-600"></i> 列印須知：
                </div>
                <p class="leading-relaxed text-[11px] text-stone-600">點擊「列印字帖」，將目標選擇為<b>「另存為 PDF」</b>，並將頁邊距設定為<b>「無」</b>，即可輸出高品質標準 A4 練習頁。</p>
            </div>
        </aside>

        <!-- Worksheet Live Preview Canvas Area -->
        <main class="lg:col-span-8 flex flex-col items-center justify-start overflow-x-auto pb-12">

            <!-- Floating Preview Status -->
            <div class="no-print mb-4 flex items-center space-x-3 bg-white px-4 py-2 rounded-full border border-stone-200/80 shadow-sm text-xs text-stone-600">
                <span class="flex items-center gap-1.5"><span class="w-2 h-2 rounded-full bg-emerald-500 inline-block"></span> 即時 A4 頁面預覽</span>
                <span class="text-stone-300">|</span>
                <span id="charCountTag" class="font-serif font-bold text-stone-800">3 個字</span>
            </div>

            <!-- Paper Sheet Workspace (A4 exact ratio & warm refined print layout) -->
            <div id="worksheetPaper" class="a4-paper print-area rounded-md p-8 sm:p-10 border border-stone-200 transition-all">
                
                <!-- Header Title Section -->
                <div id="worksheetHeader" class="text-center mb-6 relative border-b pb-4 border-stone-200">
                    <!-- Subtle Cartoon/Illustrative Elements -->
                    <div id="decorLeft" class="absolute left-2 top-0 text-stone-400 opacity-80">
                        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l2.4 7.4h7.6l-6.2 4.5 2.4 7.4-6.2-4.5-6.2 4.5 2.4-7.4-6.2-4.5h7.6z"/></svg>
                    </div>
                    <div id="decorRight" class="absolute right-2 top-0 text-stone-400 opacity-80">
                        <svg class="w-7 h-7" viewBox="0 0 24 24" fill="currentColor"><path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34c-.39-.39-1.02-.39-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/></svg>
                    </div>

                    <h1 id="headerSubtitle" class="text-2xl font-bold tracking-widest font-kaiti mb-1 text-sage-800">
                        全名筆順寫字帖
                    </h1>
                    <div id="headerTagline" class="text-[11px] font-serif text-stone-500 tracking-wider uppercase">
                        一筆一劃 ‧ 寫好名字
                    </div>

                    <!-- Student Info Bar -->
                    <div class="mt-4 flex justify-between items-center text-xs font-serif text-stone-700 px-2">
                        <div>姓名：<span id="displayName" class="font-bold text-stone-900 font-kaiti px-2 border-b border-stone-400 inline-block min-w-[80px]">王詩涵</span></div>
                        <div>班別：<span id="displayClass" class="px-2 border-b border-stone-400 inline-block min-w-[60px]">K3A 大班</span></div>
                        <div>日期：<span id="displayDate" class="px-2 border-b border-stone-400 inline-block min-w-[90px]">____年__月__日</span></div>
                    </div>
                </div>

                <!-- Dynamic Character Blocks Container -->
                <div id="characterBlocksContainer" class="space-y-5">
                    <!-- Dynamic character practice sections injected here -->
                </div>

                <!-- Footer Page Label -->
                <div class="mt-8 text-center text-[10px] text-stone-400 border-t border-stone-200 pt-3 flex justify-between items-center font-serif">
                    <span>標準繁體楷體筆順字帖 ‧ 繁體字學習練習</span>
                    <span>頁碼 1 / 1</span>
                </div>

            </div>
        </main>
    </div>

    <!-- Modal: Stroke Order Animation Player -->
    <div id="animModal" class="fixed inset-0 bg-stone-900/40 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-xl max-w-md w-full p-6 space-y-4 relative border border-stone-200">
            <button onclick="toggleAnimationModal()" class="absolute top-4 right-4 text-stone-400 hover:text-stone-600 text-lg">
                <i class="fa-solid fa-xmark"></i>
            </button>

            <div class="text-center">
                <h3 class="text-base font-bold font-serif text-stone-800 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-wand-magic-sparkles text-amber-500"></i> 動態筆順示範
                </h3>
                <p class="text-xs text-stone-500 mt-0.5">點擊下方漢字觀看標準楷體筆順動畫</p>
            </div>

            <!-- Selected Character Tabs -->
            <div id="animCharTabs" class="flex justify-center gap-2 border-b border-stone-100 pb-3">
                <!-- Tabs inserted dynamically -->
            </div>

            <!-- HanziWriter Animation Canvas Container -->
            <div class="flex justify-center my-3">
                <div id="hanziWriterTarget" class="w-60 h-60 border border-stone-200 rounded-xl bg-stone-50/50 flex items-center justify-center shadow-inner relative">
                    <!-- Target element for HanziWriter -->
                </div>
            </div>

            <!-- Controls -->
            <div class="flex justify-center gap-2.5">
                <button onclick="playStrokeAnimation()" class="bg-sage-600 hover:bg-sage-700 text-white px-4 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5 shadow-sm">
                    <i class="fa-solid fa-play"></i> 重播動畫
                </button>
                <button onclick="animateStrokeStepByStep()" class="bg-stone-100 hover:bg-stone-200 text-stone-700 border border-stone-200 px-4 py-2 rounded-lg text-xs font-semibold transition flex items-center gap-1.5">
                    <i class="fa-solid fa-forward-step"></i> 逐筆演練
                </button>
            </div>
        </div>
    </div>

    <script>
        // Dictionary for Cantonese Jyutping, Mandarin Pinyin, and Zhuyin lookup
        const PHONETIC_DICT = {
            '王': { pinyin: 'wáng', jyutping: 'wong4', zhuyin: 'ㄨㄤˊ' },
            '詩': { pinyin: 'shī', jyutping: 'si1', zhuyin: 'ㄕ' },
            '涵': { pinyin: 'hán', jyutping: 'ham4', zhuyin: 'ㄏㄢˊ' },
            '陳': { pinyin: 'chén', jyutping: 'can4', zhuyin: 'ㄔㄣˊ' },
            '樂': { pinyin: 'lè', jyutping: 'lok6', zhuyin: 'ㄌㄜˋ' },
            '軒': { pinyin: 'xuān', jyutping: 'hin1', zhuyin: 'ㄒㄨㄢ' },
            '張': { pinyin: 'zhāng', jyutping: 'zoeng1', zhuyin: 'ㄓㄤ' },
            '梓': { pinyin: 'zǐ', jyutping: 'zi2', zhuyin: 'ㄗˇ' },
            '童': { pinyin: 'tóng', jyutping: 'tung4', zhuyin: 'ㄊㄨㄥˊ' },
            '李': { pinyin: 'lǐ', jyutping: 'lei5', zhuyin: 'ㄌㄧˇ' },
            '嘉': { pinyin: 'jiā', jyutping: 'gaa1', zhuyin: 'ㄐㄧㄚ' },
            '欣': { pinyin: 'xīn', jyutping: 'jan1', zhuyin: 'ㄒㄧㄣ' },
            '黃': { pinyin: 'huáng', jyutping: 'wong4', zhuyin: 'ㄏㄨㄤˊ' },
            '林': { pinyin: 'lín', jyutping: 'lam4', zhuyin: 'ㄌㄧㄣˊ' },
            '劉': { pinyin: 'liú', jyutping: 'lau4', zhuyin: 'ㄌㄧㄡˊ' },
            '趙': { pinyin: 'zhào', jyutping: 'ziu6', zhuyin: 'ㄓㄠˋ' },
            '錢': { pinyin: 'qián', jyutping: 'cin4', zhuyin: 'ㄑㄧㄢˊ' },
            '孫': { pinyin: 'sūn', jyutping: 'syun1', zhuyin: 'ㄙㄨㄣ' },
            '吳': { pinyin: 'wú', jyutping: 'ng4', zhuyin: 'ㄨˊ' },
            '郭': { pinyin: 'guō', jyutping: 'gwok3', zhuyin: 'ㄍㄨㄛ' },
            '蔡': { pinyin: 'cài', jyutping: 'coi3', zhuyin: 'ㄘㄞˋ' },
            '楊': { pinyin: 'yáng', jyutping: 'joeng4', zhuyin: 'ㄧㄤˊ' },
            '鄭': { pinyin: 'zhèng', jyutping: 'zeng6', zhuyin: 'ㄓㄥˋ' },
            '謝': { pinyin: 'xiè', jyutping: 'ze6', zhuyin: 'ㄒㄧㄝˋ' },
            '許': { pinyin: 'xǔ', jyutping: 'heoi2', zhuyin: 'ㄒㄩˇ' },
            '鄧': { pinyin: 'dèng', jyutping: 'dang6', zhuyin: 'ㄉㄥˋ' },
            '馮': { pinyin: 'féng', jyutping: 'fung4', zhuyin: 'ㄈㄥˊ' },
            '曾': { pinyin: 'zēng', jyutping: 'zang1', zhuyin: 'ㄗㄥ' },
            '葉': { pinyin: 'yè', jyutping: 'jip6', zhuyin: 'ㄧㄝˋ' },
            '梁': { pinyin: 'liáng', jyutping: 'loeng4', zhuyin: 'ㄌㄧㄤˊ' }
        };

        // Theme Palette Mapping with soft elegant print tones
        const THEMES = {
            green: {
                titleColor: 'text-sage-800',
                subColor: 'text-sage-600',
                gridBorder: '#A3B899',
                gridDash: '#CBE0C1',
                accentBadge: 'bg-sage-600 text-white',
                strokeHighlight: '#C84B31'
            },
            red: {
                titleColor: 'text-stone-900',
                subColor: 'text-rose-700',
                gridBorder: '#E8A7A1',
                gridDash: '#F5D0CC',
                accentBadge: 'bg-rose-800 text-white',
                strokeHighlight: '#B83B5E'
            },
            blue: {
                titleColor: 'text-slate-900',
                subColor: 'text-sky-700',
                gridBorder: '#A4C3D2',
                gridDash: '#D6E4EC',
                accentBadge: 'bg-slate-700 text-white',
                strokeHighlight: '#2B580C'
            },
            black: {
                titleColor: 'text-stone-900',
                subColor: 'text-stone-700',
                gridBorder: '#CCCCCC',
                gridDash: '#E5E5E5',
                accentBadge: 'bg-stone-800 text-white',
                strokeHighlight: '#C84B31'
            }
        };

        // Custom pronunciation overrides stored by user
        let customPronunciations = {};
        let activeAnimWriter = null;
        let activeAnimChar = '';

        window.onload = function() {
            const today = new Date();
            document.getElementById('inputDate').value = `${today.getFullYear()}/${String(today.getMonth()+1).padStart(2,'0')}/${String(today.getDate()).padStart(2,'0')}`;
            renderWorksheet();
        };

        function setSampleName(name) {
            document.getElementById('inputName').value = name;
            renderWorksheet();
        }

        // Main rendering trigger
        async function renderWorksheet() {
            const name = document.getElementById('inputName').value.trim() || '王詩涵';
            const subtitle = document.getElementById('inputSubtitle').value.trim() || '全名筆順寫字帖';
            const studentClass = document.getElementById('inputClass').value.trim();
            const dateStr = document.getElementById('inputDate').value.trim();

            const pinyinMode = document.getElementById('pinyinMode').value;
            const gridStyle = document.getElementById('gridStyle').value;
            const themeKey = document.getElementById('colorTheme').value;
            const showBreakdown = document.getElementById('showStrokeBreakdown').checked;
            const showBigSample = document.getElementById('showBigSample').checked;
            const showDecorations = document.getElementById('showDecorations').checked;
            const tracingRows = parseInt(document.getElementById('tracingRows').value, 10);
            const colsPerRow = parseInt(document.getElementById('colsPerRow').value, 10);
            const traceOpacity = parseFloat(document.getElementById('traceOpacity').value) / 100;

            const theme = THEMES[themeKey] || THEMES.green;

            // Update Sheet Header Text
            document.getElementById('headerSubtitle').className = `text-2xl font-bold tracking-widest font-kaiti mb-1 ${theme.titleColor}`;
            document.getElementById('headerSubtitle').innerText = subtitle;
            document.getElementById('displayName').innerText = name;
            document.getElementById('displayClass').innerText = studentClass || '____';
            document.getElementById('displayDate').innerText = dateStr || '____年__月__日';

            // Toggle Decorations
            document.getElementById('decorLeft').style.display = showDecorations ? 'block' : 'none';
            document.getElementById('decorRight').style.display = showDecorations ? 'block' : 'none';

            // Update Character count tag
            const characters = Array.from(name).filter(c => c.trim().length > 0);
            document.getElementById('charCountTag').innerText = `${characters.length} 個字`;

            // Update Pronunciation Input Controls
            updatePronunciationEditors(characters, pinyinMode);

            // Container for worksheet blocks
            const container = document.getElementById('characterBlocksContainer');
            container.innerHTML = '';

            for (let i = 0; i < characters.length; i++) {
                const char = characters[i];
                const pronText = getPronunciation(char, pinyinMode, i);

                const blockEl = document.createElement('div');
                blockEl.className = 'border rounded-lg p-3 relative bg-white transition';
                blockEl.style.borderColor = theme.gridBorder;

                // 1. Pronunciation & Char Header
                let headerHTML = `
                    <div class="flex items-center gap-3 mb-2">
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded ${theme.accentBadge}">字 ${i + 1}</span>
                        ${pinyinMode !== 'none' ? `<span class="text-sm font-semibold text-stone-700 tracking-wider font-mono">${pronText}</span>` : ''}
                        <button onclick="openAnimForChar('${char}')" class="no-print text-[11px] text-amber-700 hover:text-amber-800 font-medium ml-auto flex items-center gap-1">
                            <i class="fa-solid fa-play-circle text-xs"></i> 播放動畫
                        </button>
                    </div>
                `;

                blockEl.innerHTML = headerHTML;

                // 2. Stroke Order Breakdown Row (全字筆順拆解)
                if (showBreakdown) {
                    const breakdownWrapper = document.createElement('div');
                    breakdownWrapper.className = 'mb-2.5 pb-2 border-b border-dashed';
                    breakdownWrapper.style.borderColor = theme.gridDash;

                    const breakdownTitle = document.createElement('div');
                    breakdownTitle.className = 'text-[10px] font-semibold text-stone-500 mb-1 flex items-center gap-1 font-serif';
                    breakdownTitle.innerHTML = `<i class="fa-solid fa-list-ol text-stone-400"></i> 全字筆順拆解步驟：`;
                    breakdownWrapper.appendChild(breakdownTitle);

                    const strokesContainer = document.createElement('div');
                    strokesContainer.className = 'flex flex-wrap gap-1.5 items-center';
                    
                    const strokeData = await fetchCharStrokeData(char);
                    if (strokeData && strokeData.strokes && strokeData.strokes.length > 0) {
                        const totalStrokes = strokeData.strokes.length;
                        for (let s = 1; s <= totalStrokes; s++) {
                            const stepSvg = createStepStrokeSVG(strokeData.strokes, s, gridStyle, theme);
                            strokesContainer.appendChild(stepSvg);
                        }
                    } else {
                        strokesContainer.innerHTML = `<span class="text-xs text-stone-400 italic">載入筆順資料中...</span>`;
                    }
                    breakdownWrapper.appendChild(strokesContainer);
                    blockEl.appendChild(breakdownWrapper);
                }

                // 3. Grid Rows
                const gridRowsContainer = document.createElement('div');
                gridRowsContainer.className = 'space-y-1.5';

                for (let r = 0; r < tracingRows; r++) {
                    const rowEl = document.createElement('div');
                    rowEl.className = 'flex items-center gap-1.5 justify-start';

                    // Big Sample Cell
                    if (r === 0 && showBigSample) {
                        const bigCell = createGridCellSVG(char, gridStyle, theme, 1.0, true, 'w-16 h-16 sm:w-20 sm:h-20');
                        rowEl.appendChild(bigCell);
                    } else if (showBigSample) {
                        const emptyCell = createGridCellSVG('', gridStyle, theme, 0, false, 'w-16 h-16 sm:w-20 sm:h-20 opacity-0');
                        rowEl.appendChild(emptyCell);
                    }

                    // Tracing Cells
                    const totalTraceCols = showBigSample ? colsPerRow - 1 : colsPerRow;
                    for (let c = 0; c < totalTraceCols; c++) {
                        const isTrace = c < Math.ceil(totalTraceCols * 0.65);
                        const cellOpacity = isTrace ? traceOpacity : 0;
                        const cell = createGridCellSVG(char, gridStyle, theme, cellOpacity, false, 'w-11 h-11 sm:w-13 sm:h-13 flex-1 max-w-[52px]');
                        rowEl.appendChild(cell);
                    }

                    gridRowsContainer.appendChild(rowEl);
                }

                blockEl.appendChild(gridRowsContainer);
                container.appendChild(blockEl);
            }
        }

        const strokeCache = {};

        async function fetchCharStrokeData(char) {
            if (strokeCache[char]) return strokeCache[char];
            try {
                const data = await HanziWriter.loadCharacterData(char);
                strokeCache[char] = data;
                return data;
            } catch (err) {
                console.warn(`Could not load stroke order data for character: ${char}`, err);
                return null;
            }
        }

        function createStepStrokeSVG(strokesArr, stepCount, gridStyle, theme) {
            const size = 36;
            const wrapper = document.createElement('div');
            wrapper.className = 'relative flex-shrink-0 border rounded bg-white shadow-none';
            wrapper.style.borderColor = theme.gridBorder;
            wrapper.style.width = `${size}px`;
            wrapper.style.height = `${size}px`;

            let gridBackgroundSVG = getGridLinesSVG(size, size, gridStyle, theme);

            let strokePathsHTML = '';
            for (let i = 0; i < stepCount; i++) {
                const isCurrent = (i === stepCount - 1);
                const color = isCurrent ? theme.strokeHighlight : '#2B2B2B';
                strokePathsHTML += `<path d="${strokesArr[i]}" fill="${color}" />`;
            }

            wrapper.innerHTML = `
                <svg viewBox="0 0 ${size} ${size}" class="absolute inset-0 w-full h-full pointer-events-none">
                    ${gridBackgroundSVG}
                </svg>
                <svg viewBox="0 0 1024 1024" class="absolute inset-0 w-full h-full p-0.5">
                    <g transform="scale(1, -1) translate(0, -900)">
                        ${strokePathsHTML}
                    </g>
                </svg>
                <span class="absolute bottom-0 right-0.5 text-[8px] font-mono text-stone-400 font-medium">${stepCount}</span>
            `;
            return wrapper;
        }

        function createGridCellSVG(char, gridStyle, theme, traceOpacity = 0, isBigSample = false, dimensionsClass = 'w-13 h-13') {
            const cell = document.createElement('div');
            cell.className = `relative rounded flex-shrink-0 flex items-center justify-center bg-white ${dimensionsClass}`;
            cell.style.border = `1px solid ${theme.gridBorder}`;

            const gridLines = getGridLinesSVG(100, 100, gridStyle, theme);

            let charContent = '';
            if (char) {
                if (isBigSample) {
                    charContent = `<span class="font-kaiti text-stone-900 font-bold select-none leading-none text-4xl sm:text-5xl">${char}</span>`;
                } else if (traceOpacity > 0) {
                    charContent = `<span class="font-kaiti text-stone-800 font-bold select-none leading-none text-2xl sm:text-3xl" style="opacity: ${traceOpacity}">${char}</span>`;
                }
            }

            cell.innerHTML = `
                <svg viewBox="0 0 100 100" class="absolute inset-0 w-full h-full pointer-events-none">
                    ${gridLines}
                </svg>
                <div class="relative z-10 flex items-center justify-center w-full h-full">
                    ${charContent}
                </div>
            `;

            return cell;
        }

        function getGridLinesSVG(w, h, style, theme) {
            if (style === 'none') return '';

            const dashColor = theme.gridDash;
            const borderColor = theme.gridBorder;

            let extraLines = '';

            if (style === 'mizige') {
                extraLines = `
                    <line x1="0" y1="0" x2="${w}" y2="${h}" stroke="${dashColor}" stroke-width="1" stroke-dasharray="3,3" />
                    <line x1="${w}" y1="0" x2="0" y2="${h}" stroke="${dashColor}" stroke-width="1" stroke-dasharray="3,3" />
                    <line x1="${w/2}" y1="0" x2="${w/2}" y2="${h}" stroke="${dashColor}" stroke-width="1" stroke-dasharray="3,3" />
                    <line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="${dashColor}" stroke-width="1" stroke-dasharray="3,3" />
                `;
            } else if (style === 'tianzige') {
                extraLines = `
                    <line x1="${w/2}" y1="0" x2="${w/2}" y2="${h}" stroke="${dashColor}" stroke-width="1" stroke-dasharray="3,3" />
                    <line x1="0" y1="${h/2}" x2="${w}" y2="${h/2}" stroke="${dashColor}" stroke-width="1" stroke-dasharray="3,3" />
                `;
            } else if (style === 'jiugongge') {
                extraLines = `
                    <line x1="${w/3}" y1="0" x2="${w/3}" y2="${h}" stroke="${dashColor}" stroke-width="2,2" />
                    <line x1="${(w*2)/3}" y1="0" x2="${(w*2)/3}" y2="${h}" stroke="${dashColor}" stroke-width="2,2" />
                    <line x1="0" y1="${h/3}" x2="${w}" y2="${h/3}" stroke="${dashColor}" stroke-width="2,2" />
                    <line x1="0" y1="${(h*2)/3}" x2="${w}" y2="${(h*2)/3}" stroke="${dashColor}" stroke-width="2,2" />
                `;
            }

            return `
                <rect x="0" y="0" width="${w}" height="${h}" fill="none" stroke="${borderColor}" stroke-width="1.2" />
                ${extraLines}
            `;
        }

        function getPronunciation(char, mode, index) {
            if (mode === 'none') return '';
            if (customPronunciations[index] !== undefined) {
                return customPronunciations[index];
            }
            if (PHONETIC_DICT[char] && PHONETIC_DICT[char][mode]) {
                return PHONETIC_DICT[char][mode];
            }
            return mode === 'pinyin' ? 'pīn' : mode === 'jyutping' ? 'ping' : 'ㄓㄨ';
        }

        function updatePronunciationEditors(characters, mode) {
            const container = document.getElementById('pronunciationInputs');
            container.innerHTML = '';

            if (mode === 'none' || characters.length === 0) {
                container.innerHTML = `<span class="text-xs text-stone-400">目前未開啟讀音標註</span>`;
                return;
            }

            characters.forEach((char, idx) => {
                const currentVal = getPronunciation(char, mode, idx);
                const row = document.createElement('div');
                row.className = 'flex items-center gap-2';
                row.innerHTML = `
                    <span class="font-kaiti font-bold text-stone-800 text-xs w-5 text-center">${char}:</span>
                    <input type="text" value="${currentVal}" 
                        oninput="customPronunciations[${idx}] = this.value; renderWorksheet();"
                        class="flex-1 text-xs px-2 py-1 border border-stone-200 rounded focus:border-sage-600 focus:outline-none font-mono bg-stone-50/50">
                `;
                container.appendChild(row);
            });
        }

        function toggleAnimationModal() {
            const modal = document.getElementById('animModal');
            modal.classList.toggle('hidden');

            if (!modal.classList.contains('hidden')) {
                const name = document.getElementById('inputName').value.trim() || '王詩涵';
                const chars = Array.from(name).filter(c => c.trim().length > 0);
                if (chars.length > 0) {
                    setupAnimTabs(chars);
                    openAnimForChar(chars[0]);
                }
            }
        }

        function setupAnimTabs(chars) {
            const tabsContainer = document.getElementById('animCharTabs');
            tabsContainer.innerHTML = '';
            chars.forEach((c) => {
                const btn = document.createElement('button');
                btn.className = `font-kaiti text-base font-bold px-3.5 py-1 rounded-lg border transition ${c === activeAnimChar ? 'bg-sage-600 text-white border-sage-600 shadow-sm' : 'bg-stone-50 text-stone-700 border-stone-200 hover:bg-stone-100'}`;
                btn.innerText = c;
                btn.onclick = () => {
                    setupAnimTabs(chars);
                    openAnimForChar(c);
                };
                tabsContainer.appendChild(btn);
            });
        }

        function openAnimForChar(char) {
            activeAnimChar = char;
            const target = document.getElementById('hanziWriterTarget');
            target.innerHTML = '';

            const modal = document.getElementById('animModal');
            if (modal.classList.contains('hidden')) {
                modal.classList.remove('hidden');
                const name = document.getElementById('inputName').value.trim() || '王詩涵';
                setupAnimTabs(Array.from(name));
            }

            activeAnimWriter = HanziWriter.create('hanziWriterTarget', char, {
                width: 220,
                height: 220,
                padding: 12,
                strokeAnimationSpeed: 1,
                delayBetweenStrokes: 300,
                strokeColor: '#2B2B2B',
                radialColor: '#D1D5DB',
                showOutline: true,
                outlineColor: '#E5E7EB'
            });

            activeAnimWriter.animateCharacter();
        }

        function playStrokeAnimation() {
            if (activeAnimWriter) {
                activeAnimWriter.animateCharacter();
            }
        }

        function animateStrokeStepByStep() {
            if (activeAnimWriter) {
                activeAnimWriter.loopCharacterAnimation();
            }
        }

        function triggerPrint() {
            window.print();
        }

        function exportImage() {
            const paper = document.getElementById('worksheetPaper');
            
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-5 right-5 bg-stone-800 text-white text-xs px-4 py-3 rounded-xl shadow-xl z-50 flex items-center gap-2 font-serif';
            toast.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-amber-400 text-sm"></i> 正在生成高清字帖圖片，請稍候...`;
            document.body.appendChild(toast);

            html2canvas(paper, {
                scale: 2,
                useCORS: true,
                backgroundColor: '#ffffff'
            }).then(canvas => {
                const link = document.createElement('a');
                const name = document.getElementById('inputName').value.trim() || '姓名字帖';
                link.download = `${name}_筆順練習字帖.png`;
                link.href = canvas.toDataURL('image/png');
                link.click();

                document.body.removeChild(toast);
            }).catch(err => {
                console.error('Image export failed:', err);
                toast.className = 'fixed bottom-5 right-5 bg-rose-700 text-white text-xs px-4 py-3 rounded-xl shadow-xl z-50';
                toast.innerHTML = `圖片生成失敗，請點擊「列印」另存為 PDF。`;
                setTimeout(() => document.body.removeChild(toast), 3000);
            });
        }
    </script>
</body>
</html>
